
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                autocomplete="off"
            >
            <button type="submit" class="add-btn">Add Task</button>
        </form>

        <div class="filters">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            <button type="button" class="filter-btn" data-filter="pending">Pending</button>
        </div>

        <div class="task-summary">
            <p>Total: <span id="totalTasks">0</span></p>
            <p>Completed: <span id="completedTasks">0</span></p>
            <p>Pending: <span id="pendingTasks">0</span></p>
        </div>

        <ul id="taskList"></ul>

        <button type="button" id="clearAllBtn" class="clear-btn">
            Clear All Tasks
        </button>
    </div>
    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");

        const totalTasks = document.getElementById("totalTasks");
        const completedTasks = document.getElementById("completedTasks");
        const pendingTasks = document.getElementById("pendingTasks");
        const clearAllBtn = document.getElementById("clearAllBtn");
        const filterButtons = document.querySelectorAll(".filter-btn");

       
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        let currentFilter = "all";

        
        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

       
        function displayTasks() {
            taskList.innerHTML = "";

            const filteredTasks = tasks.filter(function(task) {
                if (currentFilter === "completed") {
                    return task.completed;
                }

                if (currentFilter === "pending") {
                    return !task.completed;
                }

                return true;
            });

            if (filteredTasks.length === 0) {
                const message = document.createElement("li");
                message.className = "empty-message";
                message.textContent = tasks.length === 0
                    ? "No tasks yet. Add your first task!"
                    : "No tasks in this category.";

                taskList.appendChild(message);
            }

            filteredTasks.forEach(function(task) {
                const li = document.createElement("li");
                li.className = "task-item";

                if (task.completed) {
                    li.classList.add("completed");
                }

               
                li.dataset.id = task.id;

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.className = "task-checkbox";
                checkbox.setAttribute("aria-label", "Mark task completed");

                const span = document.createElement("span");
                span.className = "task-text";
                span.textContent = task.text;

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";
                deleteButton.setAttribute("aria-label", "Delete " + task.text);

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteButton);

                taskList.appendChild(li);
            });

            // Update task counters
            totalTasks.textContent = tasks.length;

            completedTasks.textContent = tasks.filter(function(task) {
                return task.completed;
            }).length;

            pendingTasks.textContent = tasks.filter(function(task) {
                return !task.completed;
            }).length;
        }

        // Add a new task
        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const taskText = taskInput.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            const newTask = {
                id: Date.now().toString() + Math.random().toString(16).slice(2),
                text: taskText,
                completed: false
            };

            tasks.push(newTask);

            saveTasks();

            taskInput.value = "";
            currentFilter = "all";
            updateActiveFilter();
            displayTasks();
        });

        // Event delegation: one listener for task interactions
        taskList.addEventListener("click", function(event) {
            const li = event.target.closest(".task-item");

            if (!li || !taskList.contains(li)) {
                return;
            }

            const taskId = li.dataset.id;

            // Delete a task
            if (event.target.closest(".delete-btn")) {
                tasks = tasks.filter(function(task) {
                    return task.id !== taskId;
                });

                saveTasks();
                displayTasks();
                return;
            }

            // Toggle completion when clicking the task text
            if (event.target.classList.contains("task-text")) {
                toggleTask(taskId);
            }
        });

        // Handle checkbox changes using the same parent list
        taskList.addEventListener("change", function(event) {
            if (!event.target.classList.contains("task-checkbox")) {
                return;
            }

            const li = event.target.closest(".task-item");

            if (li) {
                toggleTask(li.dataset.id);
            }
        });

        // Toggle task completion
        function toggleTask(taskId) {
            tasks = tasks.map(function(task) {
                if (task.id === taskId) {
                    return {
                        ...task,
                        completed: !task.completed
                    };
                }

                return task;
            });

            saveTasks();
            displayTasks();
        }

        // Update active filter button
        function updateActiveFilter() {
            filterButtons.forEach(function(button) {
                button.classList.toggle(
                    "active",
                    button.dataset.filter === currentFilter
                );
            });
        }

        // Filter tasks
        filterButtons.forEach(function(button) {
            button.addEventListener("click", function() {
                currentFilter = button.dataset.filter;
                updateActiveFilter();
                displayTasks();
            });
        });

        // Clear all tasks
        clearAllBtn.addEventListener("click", function() {
            if (tasks.length === 0) {
                alert("There are no tasks to clear.");
                return;
            }

            const confirmed = confirm("Are you sure you want to delete all tasks?");

            if (confirmed) {
                tasks = [];
                saveTasks();
                displayTasks();
            }
        });

        // Show saved tasks when the page opens
        displayTasks();
    </script>

</body>
</html>
