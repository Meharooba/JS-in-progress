<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let year = Number(prompt("Enter a year"));

    for (let i = 1; i <= 1; i++) {
        if (year % 400 == 0) {
            console.log("Leap year");
        } else if (year % 4 == 0 && year % 100 != 0) {
            console.log("Leap year");
        } else {
            console.log("Not a leap year");
        }
    }
</script>
</body>
</html>
