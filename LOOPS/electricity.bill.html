<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let units = Number(prompt("Enter electricity units"));
    let bill;

    for (let i = 1; i <= 1; i++) {
        if (units <= 100) {
            bill = units * 1;
        } else if (units <= 200) {
            bill = units * 2;
        } else {
            bill = units * 3;
        }
        console.log("Electricity Bill = ₹" + bill);
    }
</script>
</body>
</html>
