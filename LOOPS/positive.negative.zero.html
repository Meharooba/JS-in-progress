<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let a = Number(prompt("Enter a number"));

    for (let i = 1; i <= 1; i++) {
        if(a>0){
            console.log("Positive")
        }else if (a<0){
            console.log("Negative")

        }else{
            console.log("Zero")
        }
    }
</script>
</body>
</html>
