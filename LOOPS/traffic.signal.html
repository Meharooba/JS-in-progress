<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let color = prompt("Enter traffic signal color").toLowerCase();

    for (let i = 1; i <= 1; i++) {
        if (color == "red") {
            console.log("Stop");
        } else if (color == "yellow") {
            console.log("Ready");
        } else if (color == "green") {
            console.log("Go");
        } else {
            console.log("Invalid color");
        }
    }
</script>
</body>
</html>
