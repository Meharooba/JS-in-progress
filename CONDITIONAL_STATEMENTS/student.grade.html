<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = Number(prompt("Enter your mark"));
        if (a>=90){
            console.log("A Grade");
        }else if (a>=75){
            console.log("B Grade");
        }else if (a>=50){
            console.log("C Grade");
        }else{
            console.log("Fail");
        }
    </script>
</body>
</html>
