<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let units = Number(prompt("Enter electricity units"));
    if (units<=100){
        console.log("Electricity bill $"+ (units*1));
    }else if (units<=200){
        console.log("Electricity bill $"+ (units*2));
    }else{
        console.log("Electricity bill $"+ (units*3));
    }
    </script>

</body>
</html>
