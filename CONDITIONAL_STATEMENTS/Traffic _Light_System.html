<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let color = prompt("Enter traffic light color").toLocaleLowerCase();
        if (color == "red"){
            console.log("STOP")
        }else if (color == "yellow"){
            console.log("GET READY")
        }else if (color == "green"){
            console.log("GO")
        }else{
            console.log("INVALID COLOR")
        }
        

    </script>
</body>
</html>
